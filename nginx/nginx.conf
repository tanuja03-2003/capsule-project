worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Upstream to API Gateway (internal Docker service name and port 8000)
    upstream api_gateway {
        server api-gateway:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ----------------------------------------------------
        # 1. Frontend Static Files (EventHub)
        # ----------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ----------------------------------------------------
        # 2. API Gateway Reverse Proxy
        # ----------------------------------------------------
        location /api/ {
            proxy_pass http://api_gateway/api/;
            proxy_http_version 1.1;

            # Forwarded headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket and Connection Upgrade support
            # proxy_set_header Upgrade $http_upgrade;
            # proxy_set_header Connection "upgrade";

            # Timeout configurations
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Buffering settings
            proxy_buffering on;
            proxy_buffers 8 16k;
            proxy_buffer_size 16k;
        }

        # ----------------------------------------------------
        # 3. Gateway Health Check Pass-Through
        # ----------------------------------------------------
        location /health {
            proxy_pass http://api_gateway/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------
        # 4. Standardized Error Handling
        # ----------------------------------------------------
        error_page 502 503 504 = @upstream_error;
        location @upstream_error {
            default_type application/json;
            return 503 '{"success":false,"error":{"code":"GATEWAY_UPSTREAM_UNAVAILABLE","message":"API Gateway or downstream services are temporarily unreachable","statusCode":503}}';
        }
    }
}
